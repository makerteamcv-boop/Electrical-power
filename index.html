<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المسار المهني لمهندس القوى الكهربائية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#0e1b2c;--bg2:#13263d;--card:#172e49;--ink:#eef3f8;--mute:#a9b9cb;--amber:#f2b134;--line:#2a4766;--wa:#25d366}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:2;font-size:17px;
background-image:radial-gradient(circle at 15% 0,#1d3a5c 0,transparent 45%),radial-gradient(circle at 90% 100%,#1b3550 0,transparent 40%)}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px;min-height:100vh}
.screen{display:none}.screen.on{display:block}
.bolt{width:56px;height:56px;margin-bottom:10px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.4;font-weight:800;margin-bottom:18px}
h2{font-size:clamp(23px,4.5vw,32px);font-weight:800;line-height:1.5;margin-bottom:14px;color:var(--amber)}
h3{font-size:20px;font-weight:700;margin:26px 0 8px;color:#fff;border-right:4px solid var(--amber);padding-right:12px}
p{margin-bottom:14px;color:#dbe5ef}
.intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:28px;text-align:justify}
ul{list-style:none;padding:0;margin:0 0 16px}
li{position:relative;padding:8px 26px 8px 0;color:#dbe5ef}
li::before{content:"";position:absolute;right:4px;top:19px;width:9px;height:9px;background:var(--amber);transform:rotate(45deg)}
li b{color:#fff}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:12px 30px;background:var(--amber);color:#1a1200;font-size:18px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.nav span{color:var(--mute);font-size:15px}
.choices{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin-top:22px}
@media(max-width:640px){.choices{grid-template-columns:1fr}}
.choice{font:inherit;text-align:right;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:26px 22px;transition:.2s}
.choice:hover{border-color:var(--amber);transform:translateY(-3px)}
.choice strong{display:block;font-size:24px;font-weight:800;color:var(--amber);margin-bottom:6px}
.choice small{font-size:15px;color:var(--mute);line-height:1.8;display:block}
.note{background:#2a2410;border:1px solid #6b5a1c;border-radius:12px;padding:14px 18px;margin:18px 0;color:#f6e7b4}
.note b{color:var(--amber)}
.tip{background:linear-gradient(135deg,#1f3b5c,#172e49);border:1px solid var(--amber);border-radius:16px;padding:24px;margin:10px 0 20px}
.tip p{color:#fff}
.cat{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;margin:22px 0;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,#0f3d2a,#14523a);border:1px solid #2f8f63;transition:.2s}
.cat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,211,102,.25)}
.cat .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--wa);display:grid;place-items:center}
.cat .ic svg{width:30px;height:30px;fill:#fff}
.cat .t{flex:1;line-height:1.7}
.cat .t b{display:block;font-size:18px}
.cat .t span{font-size:14px;color:#bfe8d3}
.cat .go{flex:none;background:var(--wa);color:#05260f;font-weight:800;border-radius:999px;padding:7px 18px;font-size:15px}
@media(max-width:520px){.cat{flex-wrap:wrap}.cat .go{width:100%;text-align:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script>
const URL_CAT="https://wa.me/c/249126940906";
const WA='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.300 1.200-1.800 1.200-.5.100-1 .2-3.200-.7-2.700-1.100-4.400-3.800-4.600-4-.1-.2-1.100-1.400-1.100-2.700s.7-1.900.9-2.200c.2-.2.5-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 1.900c.1.200.1.400 0 .5l-.3.500-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.4.100.6-.1l.8-1c.2-.3.400-.2.600-.1l1.800.9c.3.100.5.200.5.300.1.200.1.700-.1 1.300z"/></svg>';
const cat=(t)=>`<a class="cat" href="${URL_CAT}" target="_blank" rel="noopener"><span class="ic">${WA}</span><span class="t"><b>${t}</b><span>تصفح كتالوج الكورسات عبر واتساب</span></span><span class="go">افتح الكتالوج</span></a>`;
const ul=(a)=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const tip=`<div class="tip"><h2>نصيحة نهائية</h2>
<p>الخريج الذي يريد العمل في المقاولات عليه أن يبدأ فوراً بتعلم AutoCAD للكهرباء (وليس الرسم المعماري)، ثم ينتقل إلى Revit MEP إن أراد المكاتب الحديثة. أما من يريد شركات الكهرباء فعليه أن يعيد فتح كتب Machines وPower Systems بجدية، لأن المقابلة الشخصية هناك تسأل عن المحول والمولد والحماية، وليس عن أوامر الأوتوكاد.</p>
<p>في النهاية، المساران ليسا منفصلين تماماً. كثير من مهندسي القوى يبدأون في المقاولات لاكتساب خبرة الموقع، ثم ينتقلون إلى شركات التوزيع أو التوليد حيث تكون الخبرة الميدانية مع المعدات الثقيلة ميزة. لكن في كل الحالات، البداية الصحيحة هي إتقان أداة واحدة بعمق – سواء كانت Shop Drawing احترافياً، أو فهم حماية محول قدرة – بدلاً من معرفة سطحية بكل شيء.</p></div>`
+cat("للحصول على كورسات القدرة عامة");

const contracting=[
`<h2>قطاع المقاولات – المكتب الفني والموقع</h2>
<h3>مقدمة</h3>
<p>المقاولات الكهربائية ليست عملاً واحداً متجانساً. هناك من يجلس أمام شاشة الكمبيوتر ليُنتج لوحة يُبنى عليها الموقع، وهناك من يقف في الموقع ليُترجم تلك اللوحة إلى كابلات وقواطع ولوحات جاهزة للتشغيل. كلاهما "مهندس كهرباء"، لكن المهارات المطلوبة مختلفة تماماً.</p>
<h3>مهندس المكتب الفني (Technical Office Engineer)</h3>
<p>مهندس المكتب الفني هو حلقة الوصل بين التصميم والتنفيذ. هو لا يصمم المشروع من الصفر عادةً، بل يأخذ تصميم الاستشاري ويُعيد إنتاجه بصيغة قابلة للتنفيذ، ويحسب الكميات، ويراجع المستخلصات، ويتأكد أن ما سيُبنى في الموقع مطابق للمواصفات والعقد.</p>
<h3>المهام الأساسية</h3>`+ul([
"<b>إعداد ومراجعة الـ Shop Drawings:</b> تحويل المخططات التصميمية إلى رسومات تنفيذية تفصيلية تُظهر مسارات الكابلات، أماكن اللوحات، تفاصيل التأسيس، والارتفاعات.",
"<b>حصر الكميات (Quantity Surveying):</b> حساب كميات الكابلات، المواسير، اللوحات، والأجهزة المطلوبة بناءً على الرسومات.",
"<b>مراجعة المستخلصات:</b> التحقق من الكميات المنفذة فعلياً في الموقع مقابل ما يطالب به المقاول.",
"<b>إعداد جداول الكميات (BOQ) والمواصفات:</b> بالتعاون مع فريق التصميم أو الاستشاري.",
"<b>التنسيق بين التخصصات:</b> التأكد من عدم تعارض مسارات الكهرباء مع الأعمال المدنية أو الميكانيكية (Coordination)."]),
`<h3>المتطلبات التقنية التي يجب إتقانها</h3>`+ul([
"<b>الأوتوكاد (AutoCAD) – مستوى متقدم:</b> لا يكفي حفظ الأوامر. مهندس المكتب الفني الكهربائي يجب أن يعرف كيف يُنشئ Shop Drawing كامل: رسم مسارات الكابلات (Cable Routing)، إعداد SLD (Single Line Diagram) للوحات، رسم Wiring Diagrams للوحات الكهربائية (Power &amp; Control)، إضافة رموز كهربائية مخصصة، وإعداد جداول بالمكونات وأرقام الأسلاك ومقاطعها. هذه المهارات هي الحد الأدنى الذي يبحث عنه أي مكتب فني يعتمد على CAD.",
"<b>الريفيت (Revit MEP) – للمكاتب التي تعتمد BIM:</b> مع تحول المشاريع الكبرى إلى نمذجة معلومات البناء، أصبح إتقان Revit MEP ميزة تنافسية قوية. المهندس الكهربائي في بيئة BIM يحتاج إلى: نمذجة مسارات الكابلات (Cable Trays)، وضع اللوحات واللمبات والمفاتيح، إنشاء الدوائر الكهربائية وربطها، واستخراج الجداول (Schedules) تلقائياً. كما يُفضل معرفة Navisworks لاكتشاف التعارضات (Clash Detection) بين الكهرباء والتخصصات الأخرى قبل التنفيذ.",
"<b>الإلمام بالكودات:</b> على الأقل الكود المحلي وكودات IEC أو NEC حسب طبيعة المشاريع، لأن المكتب الفني هو من يُدقق مطابقة الرسومات للمواصفات."])
+`<div class="note"><b>ملاحظة مهمة:</b> المكتب الفني ليس فقط "رسم". من يعمل في مكتب فني مقاولات يجب أن يفهم تسلسل التنفيذ جيداً، لأن Shop Drawing سيئ يعني إعادة عمل في الموقع، وهذا ما يكلف الشركة أموالاً.</div>`,

`<h2>مهندس الموقع (Site Engineer)</h2>
<p>مهندس الموقع هو "العين" على الأرض. هو المسؤول عن أن ما يُركّب فعلياً مطابق للرسومات والمواصفات، وأن العمل يسير وفق الجدول الزمني، وأن معايير السلامة مطبقة. الفرق الجوهري بينه وبين مهندس المكتب الفني هو أن الأول يتعامل مع واقع متغير كل يوم: مقاول باطن متأخر، مواد وصلت مخالفة للمواصفات، تعارض في الموقع لم يظهر على الورق.</p>`
+cat("للحصول على كورسات المقاولات")
+`<h3>المهام الأساسية</h3>`+ul([
"<b>الإشراف على التركيبات الكهربائية:</b> متابعة تركيب المواسير والكابلات واللوحات والمفاتيح والمقابس ولوحات التوزيع.",
"<b>مراقبة الجودة:</b> التأكد من أن المواد الموردة مطابقة للمواصفات المعتمدة، وأن طرق التركيب صحيحة (ارتفاعات، تثبيت، عزل، تأريض).",
"<b>الاختبارات والتشغيل:</b> الإشراف على اختبارات الكابلات واللوحات (Insulation Resistance, Continuity, Earth Resistance) والمشاركة في التشغيل التجريبي (Testing &amp; Commissioning).",
"<b>التنسيق اليومي:</b> مع المقاولين والموردين وفريق المكتب الفني لحل المشكلات الطارئة (RFIs).",
"<b>التوثيق:</b> تقارير يومية، طلبات فحص (Inspection Requests)، وحصر الأعمال المنفذة."])
+`<h3>المهارات التي يجب إتقانها</h3>`+ul([
"<b>قراءة الرسومات بسرعة:</b> ليس فقط المخططات الكهربائية، بل أيضاً المخططات المعمارية والإنشائية، لأن موقع اللوحة يعتمد على الجدار، ومسار الكابل يعتمد على السقف أو الأرضية.",
"<b>معرفة عملية بالمواد:</b> أنواع الكابلات (XLPE/PVC، أحادية/متعددة الأوجه)، القواطع (MCB/MCCB/ACB)، لوحات التوزيع، أنظمة التأريض. المهندس الذي لا يعرف الفرق بين كابل 3×2.5 و 3×4 من نظرة سريعة سيتعب في الموقع.",
"<b>الإلمام بأنظمة التيار الخفيف:</b> حتى لو كان التخصص \"قوى\"، غالباً ما يُطلب من مهندس الموقع الإشراف على Fire Alarm و CCTV و Data، على الأقل لفهم التعارضات والتنسيق.",
"<b>مهارات التواصل وإدارة الأزمات:</b> مهندس الموقع يتعامل مع عمال وفنيين ومقاولين، وأحياناً يكون الحل الهندسي البسيط هو \"اتفق مع النجار على تعديل الفتحة\" قبل أن يُقص الكابل."])
+cat("للحصول على كورسات المقاولات"),

tip];

const gen=[
`<h2>شركات التوليد والنقل والتوزيع</h2>
<p>إذا كان قطاع المقاولات يبني ما سيعمل، فإن شركات الكهرباء (توليد، نقل، توزيع) تُشغّل ما هو عامل بالفعل. هنا لا يوجد "Shop Drawing" بالمعنى المقاولاتي، بل يوجد تشغيل وصيانة وحماية. المتطلبات المعرفية مختلفة جذرياً.</p>`
+cat("للحصول على كورسات التوليد والنقل والتوزيع")
+`<h3>ما الذي تطلبه هذه الشركات؟</h3>
<p>الشركات التي تدير محطات توليد أو شبكات نقل أو توزيع تبحث عن مهندس يفهم المعدات الكهربائية الثقيلة فهماً عميقاً، لأن خطأً واحداً في محطة محولات قد يعني انقطاعاً واسعاً أو تلفاً بملايين الجنيهات. النقاط المعرفية الأساسية:</p>`+ul([
"<b>المولد (Generator):</b> مبدأ العمل، أنظمة الإثارة (Excitation Systems)، التبريد، الحماية الميكانيكية والكهربائية، التزامن (Synchronization) مع الشبكة.",
"<b>المحرك (Motor):</b> أنواعه (Induction/Synchronous)، طرق البدء (DOL, Star-Delta, Soft Starter, VFD)، الحماية الحرارية والكهربائية.",
"<b>التوربين (Turbine):</b> سواء بخاري أو غازي، العلاقة بين السرعة والتردد، أنظمة التحكم في السرعة (Governor)، والحماية من السرعة الزائدة (Overspeed).",
"<b>المحول (Transformer):</b> أنواعه (Power/Distribution)، التبريد (ONAN/ONAF)، مجموعة التوصيل (Vector Group)، اختبارات الزيت، والحماية التفاضلية (Differential Protection).",
"<b>أنظمة الحماية (Protection Systems):</b> فهم Relays (Overcurrent, Earth Fault, Differential, Distance)، تنسيق الحمايات (Coordination)، والقواطع الآلية.",
"<b>عزل وتشغيل القواطع:</b> إجراءات العزل الكهربائي (Isolation)، التأريض الآمن، إعادة التشغيل بعد الأعطال، وفهم Interlocking بين القواطع والمفاتيح.",
"<b>مفاتيح الجهد المنخفض والمتوسط (LV/MV Switchgear):</b> أنواعها (Air, Vacuum, SF6)، قدرات القطع (Breaking Capacity)، وأنظمة القياس والتحكم."]),

`<h2>مهندس المكتب vs. مهندس الموقع في هذا القطاع</h2>
<p>حتى في شركات الكهرباء، يوجد تمييز بين دورين:</p>
<h3>مهندس المكتب (Office/Planning/Design Engineer)</h3>`+ul([
"قد يعمل في إدارة التخطيط أو الصيانة المخططة أو الدراسات.",
"مهامه: تحليل أعطال المعدات، إعداد برامج الصيانة الوقائية، دراسة توسعات الشبكة، مراجعة تقارير الاختبارات، وإعداد المواصفات الفنية للمعدات الجديدة.",
"يحتاج إلى معرفة نظرية أعمق مع مهارات تحليلية (Excel، وربما برامج محاكاة)، وقدرة على قراءة النتائج والاستنتاج."])
+`<h3>مهندس الموقع (Operation/Substation Engineer)</h3>`+ul([
"يعمل في محطة توليد أو محطة محولات أو مركز توزيع.",
"مهامه: التشغيل اليومي، عزل المعدات للصيانة، استقبال الأعطال والاستجابة الأولى، تنفيذ اختبارات الوقاية، والإشراف على فرق الصيانة.",
"يحتاج إلى معرفة إجرائية دقيقة: خطوات العزل، إجراءات السلامة، قراءة لوحات التحكم، والتعامل مع أنظمة SCADA."])
+cat("للحصول على كورسات التوليد والنقل والتوزيع"),

tip];

const bolt='<svg class="bolt" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#172e49" stroke="#f2b134" stroke-width="2"/><path d="M36 8 18 36h12l-4 20 20-30H33z" fill="#f2b134"/></svg>';
let st={v:"welcome",sec:null,i:0};
const app=document.getElementById("app");
function go(v,sec,i){st={v,sec:sec||null,i:i||0};render();scrollTo(0,0)}
function render(){
 let h="";
 if(st.v==="welcome"){
  h=`${bolt}<h1>مرحباً بك مهندس القوى الكهربائية</h1>
  <div class="intro"><p style="margin:0">يُعد تخصص الهندسة الكهربائية – فرع القوى (Power) – من أكثر التخصصات الهندسية كثافةً في الطلب العملي، لأنه يمثل العمود الفقري لكل مشروع إنشائي أو صناعي أو بنية تحتية. لكن السؤال الذي يواجه الخريج الجديد ليس "أين أعمل؟" بل "ما الفرق بين مكتب فني وموقع؟ وما الذي يجب أن أتعلمه بالضبط لأكون جاهزاً؟". هذا المقال يحاول رسم خريطة واضحة لمسارين رئيسيين: قطاع المقاولات، وشركات التوليد والنقل والتوزيع، مع تفصيل الأدوار والمتطلبات التقنية لكل منهما.</p></div>
  <button class="btn" onclick="go('choose')">استمرار</button>`;
 } else if(st.v==="choose"){
  h=`${bolt}<h2>اختر القطاع الذي تريد التعرف عليه</h2>
  <div class="choices">
   <button class="choice" onclick="go('page','c',0)"><strong>قطاع المقاولات</strong><small>المكتب الفني والموقع: المهام والأدوات والمهارات المطلوبة.</small></button>
   <button class="choice" onclick="go('page','g',0)"><strong>قطاع التوليد والنقل والتوزيع</strong><small>التشغيل والصيانة والحماية في شركات الكهرباء.</small></button>
  </div>
  <div class="nav"><button class="btn ghost" onclick="go('welcome')">رجوع</button><span></span></div>`;
 } else {
  const pages=st.sec==="c"?contracting:gen, n=pages.length, last=st.i===n-1;
  h=pages[st.i]+`<div class="nav">
   <button class="btn ghost" onclick="${st.i?`go('page','${st.sec}',${st.i-1})`:`go('choose')`}">السابق</button>
   <span>${st.i+1} / ${n}</span>
   ${last?`<button class="btn" onclick="go('choose')">اختيار قطاع آخر</button>`:`<button class="btn" onclick="go('page','${st.sec}',${st.i+1})">التالي</button>`}
  </div>`;
